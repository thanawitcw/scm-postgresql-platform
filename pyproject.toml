[project]
name = "scm-etl"
version = "0.1.0"
description = "SCM Data Platform ETL — native Windows service + PostgreSQL 18"
requires-python = "==3.12.*"
dependencies = [
    "psycopg[binary]>=3.1",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "pyodbc>=5.0",
    "pydantic-settings>=2.0",
    "typer>=0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.alembic]
script_location = "alembic"

[tool.hatch.build.targets.wheel]
packages = ["etl"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
etl = "etl.cli:app"
